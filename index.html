<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Shadow Extraction — an isometric stealth hostage-rescue game.">
  <title>Shadow Extraction</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <canvas id="view" aria-label="Game view"></canvas>
    <div id="hud" class="hidden"></div>
    <div id="controls" class="hidden"></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="screen" class="screen hidden"></div>
    <div id="rotate" class="hidden"><div class="rot-icon">⟳</div><div class="rot-t">Rotate your phone</div><div class="rot-s">Shadow Extraction is designed for landscape.</div><button class="primary" data-rot="lock">Switch to landscape</button><button data-rot="portrait">Play in portrait anyway</button></div>
    <div id="safe-probe" aria-hidden="true"></div>
  </div>
  <noscript><div style="color:#ddd;font:16px system-ui;padding:24px">Shadow Extraction needs JavaScript.</div></noscript>
  <script type="module" src="main.js"></script>
</body>
</html>
